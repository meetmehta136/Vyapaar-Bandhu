version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: vyapaar_bandhu_db
    hostname: db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vyapaar_bandhu
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vyapaar-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vyapaar_bandhu_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/vyapaar_bandhu
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - HF_API_KEY=${HF_API_KEY}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - JWT_SECRET=${JWT_SECRET:-vyapaarbandhu-secret-key}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - GSTMIND_DB_PATH=${GSTMIND_DB_PATH:-data/chromadb}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - vyapaar-net

  frontend:
    build:
      context: ./vyapaarbandhu-ca-elite
      dockerfile: Dockerfile
    container_name: vyapaar_bandhu_frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./vyapaarbandhu-ca-elite:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - vyapaar-net

volumes:
  pgdata:

networks:
  vyapaar-net:
    driver: bridge
